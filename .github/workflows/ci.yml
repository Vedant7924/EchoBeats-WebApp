name: EchoBeats CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Backend Test & Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js v22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install Monorepo Dependencies
        run: |
          cd backend && npm ci
          cd ../frontend && npm ci

      - name: Run Backend Integration Test Suite
        run: |
          cd backend
          npm test

      - name: Build Frontend Client Bundle
        run: |
          cd frontend
          npm run build
